apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: idea-board
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: idea-board-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+psycopg://ideaboard:$(POSTGRES_PASSWORD)@postgres:5432/idea_board"
            - name: CORS_ORIGINS
              value: "http://localhost:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: idea-board
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
